name: NASA Asteroid Radar Pipeline

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: read

jobs:
  run-radar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Physics Unit Tests
        run: |
          pytest -v

      - name: Restore SQLite State Cache
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: nasa-radar-sqlite-${{ github.run_id }}
          restore-keys: |
            nasa-radar-sqlite-

      - name: Execute Telemetry & Simulation Pipeline
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.8-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_LANG: ar
          DB_PATH: data/radar.db
          LOG_LEVEL: INFO
        run: |
          mkdir -p data
          python -m src.main