name: NASA Asteroid Radar Pipeline

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات
    - cron: '0 */6 * * *'
  # يتيح التشغيل اليدوي الفوري من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Run NASA NeoWs & AI Simulation Pipeline
        env:
          PYTHONPATH: .
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_LANG: ar
        run: |
          mkdir -p data
          python -m src.main

      - name: Commit updated SQLite state database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/radar.db || true
          git diff --staged --quiet || git commit -m "chore(data): update processed NEO telemetry state [skip ci]"
          git push
